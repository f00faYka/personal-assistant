name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Temporary required-check failure probe
        run: exit 1

      - name: Lint
        run: npm run lint

      - name: Typecheck API
        run: npm run typecheck

      - name: Typecheck mobile
        run: npm run mobile:typecheck

      - name: Test API
        run: npm test

      - name: Test mobile
        run: npm run mobile:test
